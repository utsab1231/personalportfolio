name: Deploy Static Next.js to Firebase Hosting

on:
  push:
    branches:
      - master  # Runs whenever you push to your master branch

permissions:
  contents: read  # Job only reads the repo; least-privilege GitHub token

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true  # Cancel an in-flight build when a newer push lands

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Files
        run: npm run build  # Runs prebuild (optimize-media) then next build; generates the 'out' folder

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@9ad0d519471afe1de970603de47075637414bfe9 # v15.27.0
        with:
          args: deploy --only hosting
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
